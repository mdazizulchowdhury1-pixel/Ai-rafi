<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Personal AI Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <div class="status-badge">
      <span class="status-dot"></span> 
      <span id="app-name-display">Personal Assistant</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="lang-toggle" aria-label="Toggle Language">🌐 EN</button>
      <button class="btn-icon" id="settings-btn" aria-label="Open Settings">⚙️</button>
    </div>
  </header>

  <div class="orb-section">
    <div class="orb" id="ai-orb"></div>
    <div class="assistant-state" id="orb-state">Tap orb or mic to speak</div>
  </div>

  <div id="chat-container">
    <div class="msg assistant">Welcome! I am your private personal assistant. You can speak in English or বাংলা.</div>
  </div>

  <div class="dock">
    <button id="mic-btn" aria-label="Microphone">🎙️</button>
    <input type="text" id="text-input" class="text-input" placeholder="Type a message or command..." autocomplete="off">
    <button id="send-btn" aria-label="Send message">➤</button>
  </div>

  <!-- Settings and Memory Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-sheet">
      <h3>Memory & Controls <button class="btn-icon" id="close-settings">✕</button></h3>
      
      <div class="field-group">
        <label>MASTER PASSPHRASE</label>
        <input type="password" id="auth-pass" class="text-input" placeholder="Enter password to authenticate">
      </div>

      <div class="field-group">
        <label>SAVED PERSISTENT MEMORIES (<span id="mem-count">0</span>)</label>
        <div id="memory-list"></div>
      </div>

      <button class="btn-action" id="export-mem-btn">📥 Export Memory to JSON</button>
      <button class="btn-danger" id="clear-mem-btn">🗑️ Wipe All Memories</button>
    </div>
  </div>

  <!-- Action Confirmation Modal -->
  <div class="modal" id="confirm-modal">
    <div class="modal-sheet">
      <h3 style="color: #ffaa00;">Action Requires Confirmation</h3>
      <p id="confirm-desc"></p>
      <div class="modal-buttons">
        <button class="btn-action" id="cancel-action-btn">Cancel</button>
        <button class="btn-danger" id="confirm-action-btn">Authorize</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
